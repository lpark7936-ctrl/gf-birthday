<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk to Your Dolphin 🐬</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            background: linear-gradient(
                180deg,
                #071b49,
                #075985,
                #0891b2
            );
                        overflow-x: hidden;
        }

        .ocean {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

h1, .subtitle, .dolphin, .welcome {
    position: relative;
    z-index: 1;
}

        .bubble {
            position: absolute;
            bottom: -50px;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            animation: rise 8s infinite ease-in;
        }

        .bubble:nth-child(1) { left: 10%; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 30%; animation-delay: 2s; }
        .bubble:nth-child(3) { left: 55%; animation-delay: 4s; }
        .bubble:nth-child(4) { left: 75%; animation-delay: 1s; }
        .bubble:nth-child(5) { left: 90%; animation-delay: 3s; }

        @keyframes rise {
            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        h1 {
            margin-top: 55px;
            font-size: 2.5rem;
            text-shadow: 0 0 15px #67e8f9;
        }

        .subtitle {
            color: #cffafe;
            font-size: 1.1rem;
        }

        .dolphin {
            font-size: 9rem;
            margin-top: 35px;
            animation: swim 3s ease-in-out infinite;
            filter: drop-shadow(0 0 25px #67e8f9);
        }

        @keyframes swim {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .welcome {
            margin: 20px auto;
            max-width: 500px;
            padding: 20px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
        }
   /* Dolphin chat window */
.chat-container {
    width: 90%;
    max-width: 550px;
    margin: 30px auto 60px;
    background: rgba(5, 30, 75, 0.85);
    border: 1px solid rgba(103, 232, 249, 0.5);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(103, 232, 249, 0.2);
}

.chat-header {
    background: rgba(8, 145, 178, 0.5);
    padding: 18px;
    font-size: 1.3rem;
    font-weight: bold;
}

.chat-header p {
    font-size: 0.85rem;
    font-weight: normal;
    margin-bottom: 0;
    color: #cffafe;
}

.chat-messages {
    height: 280px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    overflow-y: auto;
}

.message {
    padding: 12px 16px;
    border-radius: 16px;
    max-width: 80%;
    line-height: 1.5;
    text-align: left;
}

.dolphin-message {
    background: #075985;
    color: white;
}

.user-message {
    background: #67e8f9;
    color: #082f49;
    align-self: flex-end;
}

.chat-input {
    display: flex;
    gap: 10px;
    padding: 15px;
    background: rgba(255,255,255,0.08);
}

.chat-input input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: none;
    border-radius: 12px;
    outline: none;
    font-size: 1rem;
}

.chat-input button {
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    background: #67e8f9;
    color: #082f49;
    font-weight: bold;
    cursor: pointer;
}

.chat-input button:hover {
    background: #a5f3fc;
}
            </style>
</head>

<body>

    <div class="ocean">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <h1>Meet Your Ocean Friend! 🌊</h1>
    <p class="subtitle">A little dolphin, always ready to listen.</p>

    <div class="dolphin">🐬</div>

  <div class="welcome">
    <h2>Hello! ❤️</h2>
    <p>I'm your friendly dolphin companion!</p>
    <p>Ask me anything. I'm always happy to chat!</p>
</div>

<div class="chat-container">
    <div class="chat-header">
        🐬 Dolphin Chat
        <p>Your friendly ocean companion</p>
    </div>

    <div id="chatMessages" class="chat-messages">
        <div class="message dolphin-message">
            Hello there! What would you like to talk about? 🌊
        </div>
    </div>

    <div class="chat-input">
        <input
            type="text"
            id="userInput"
            placeholder="Talk to your dolphin..."
        >
        <button id="sendButton" type="button">Send</button>
    </div>
</div>
  
<script>
    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const chatMessages = document.getElementById("chatMessages");

    const workerURL =
        "https://autumn-cell-2bb4.leopcentral.workers.dev";

    const conversation = [];

    function addMessage(text, className) {
        const bubble = document.createElement("div");
        bubble.className = "message " + className;
        bubble.textContent = text;
        chatMessages.appendChild(bubble);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
        const message = userInput.value.trim();

        if (!message || sendButton.disabled) return;

        addMessage(message, "user-message");
        conversation.push({
            role: "user",
            content: message
        });

        userInput.value = "";
        sendButton.disabled = true;
        sendButton.textContent = "Thinking...";

        try {
            const response = await fetch(workerURL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    messages: conversation
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Connection failed.");
            }

            if (!data.reply) {
                throw new Error("The dolphin returned an empty reply.");
            }

            addMessage(data.reply, "dolphin-message");

            conversation.push({
                role: "assistant",
                content: data.reply
            });

        } catch (error) {
            console.error(error);
addMessage(
    "Connection error: " + error.message,
    "dolphin-message"
);
        } finally {
            sendButton.disabled = false;
            sendButton.textContent = "Send";
            userInput.focus();
        }
    }

    sendButton.addEventListener("click", sendMessage);

    userInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>
</body>
</html>
