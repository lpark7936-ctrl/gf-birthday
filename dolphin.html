<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk to Your Dolphin 🐬</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            background: linear-gradient(
                180deg,
                #071b49,
                #075985,
                #0891b2
            );
            overflow-x: hidden;
.ocean {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

h1, .subtitle, .dolphin, .welcome {
    position: relative;
    z-index: 1;
}

        .bubble {
            position: absolute;
            bottom: -50px;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            animation: rise 8s infinite ease-in;
        }

        .bubble:nth-child(1) { left: 10%; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 30%; animation-delay: 2s; }
        .bubble:nth-child(3) { left: 55%; animation-delay: 4s; }
        .bubble:nth-child(4) { left: 75%; animation-delay: 1s; }
        .bubble:nth-child(5) { left: 90%; animation-delay: 3s; }

        @keyframes rise {
            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        h1 {
            margin-top: 55px;
            font-size: 2.5rem;
            text-shadow: 0 0 15px #67e8f9;
        }

        .subtitle {
            color: #cffafe;
            font-size: 1.1rem;
        }

        .dolphin {
            font-size: 9rem;
            margin-top: 35px;
            animation: swim 3s ease-in-out infinite;
            filter: drop-shadow(0 0 25px #67e8f9);
        }

        @keyframes swim {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .welcome {
            margin: 20px auto;
            max-width: 500px;
            padding: 20px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="ocean">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <h1>Meet Your Ocean Friend! 🌊</h1>
    <p class="subtitle">A little dolphin, always ready to listen.</p>

    <div class="dolphin">🐬</div>

    <div class="welcome">
        <h2>Hello! ❤️</h2>
        <p>I'm your friendly dolphin companion!</p>
        <p>Soon, we'll be able to talk about anything and everything.</p>
    </div>

</body>
</html>
